name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# The `dtolnay/rust-toolchain@<version>` refs below must match rust-toolchain.toml.
jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: tenant_saas_test
          POSTGRES_USER: db_owner
          POSTGRES_PASSWORD: owner_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U db_owner -d tenant_saas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      # Owner account: used by psql and sqlx-cli below.
      MIGRATION_URL: postgres://db_owner:owner_password@localhost:5432/tenant_saas_test
      RUNTIME_URL: postgres://app_runtime:runtime_password@localhost:5432/tenant_saas_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version "^0.8" --no-default-features --features postgres --locked
      # Same script docker-compose runs on first start, so CI and local dev agree.
      - name: Create app_runtime role
        run: psql "$MIGRATION_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/00_roles.sql
      - name: Run migrations
        run: sqlx migrate run --source apps/tenant-saas/migrations
        env:
          DATABASE_URL: ${{ env.MIGRATION_URL }}
      - name: Verify app_runtime cannot perform DDL
        run: |
          output=$(psql "$RUNTIME_URL" -c "CREATE TABLE forbidden_test ();" 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "permission denied"
          echo "Runtime role DDL restriction: PASS"
      - name: Run tests
        run: cargo test --workspace
        env:
          DATABASE_URL: ${{ env.RUNTIME_URL }}

  build:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin tenant-saas-api
