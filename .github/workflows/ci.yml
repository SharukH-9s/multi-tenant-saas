name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# The `dtolnay/rust-toolchain@<version>` refs below must match rust-toolchain.toml.
jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify TenantContext constructor grep guard
        run: |
          count=$(grep -rn "from_verified_membership" apps/tenant-saas/src/ | grep -v "auth/tenant_resolver.rs" | wc -l)
          if [ "$count" -ne 0 ]; then
            echo "FORBIDDEN: TenantContext::from_verified_membership called outside auth::tenant_resolver!"
            exit 1
          fi
          echo "TenantContext constructor grep guard: PASS"
      - name: Verify object_key never appears in handlers
        run: |
          count=$(grep -rn "object_key" apps/tenant-saas/src/handlers/ | wc -l)
          if [ "$count" -ne 0 ]; then
            echo "FORBIDDEN: object_key referenced in handlers/ — must not appear in response DTOs!"
            grep -rn "object_key" apps/tenant-saas/src/handlers/
            exit 1
          fi
          echo "object_key handler guard: PASS"
      - name: Verify begin_system_tenant_tx is only called by the worker path
        run: |
          # The worker-only tx helper takes a raw tenant id. It must never be
          # reachable from an HTTP handler, so callers are limited to the
          # ingestion service, the ingestion repository and workers/.
          hits=$(grep -rn "begin_system_tenant_tx" apps/tenant-saas/src/             | grep -v "apps/tenant-saas/src/services/ingestion_service.rs"             | grep -v "apps/tenant-saas/src/repositories/ingestion_repo.rs"             | grep -v "apps/tenant-saas/src/workers/" || true)
          if [ -n "$hits" ]; then
            echo "FORBIDDEN: begin_system_tenant_tx used outside the worker path:"
            echo "$hits"
            exit 1
          fi
          echo "begin_system_tenant_tx grep guard: PASS"
      - name: Verify pure ingestion and AI modules do not touch the database
        run: |
          hits=$(grep -rn "sqlx" apps/tenant-saas/src/ingestion/ apps/tenant-saas/src/ai/ apps/tenant-saas/src/domain/ || true)
          if [ -n "$hits" ]; then
            echo "FORBIDDEN: sqlx referenced in a pure module:"
            echo "$hits"
            exit 1
          fi
          echo "pure-module sqlx guard: PASS"

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: tenant_saas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tenant_saas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      # Bootstrap superuser for role initialization
      BOOTSTRAP_URL: postgres://postgres:postgres_password@localhost:5432/tenant_saas_test
      # Non-superuser migration runner
      MIGRATION_URL: postgres://db_owner:owner_password@localhost:5432/tenant_saas_test
      # Application runtime role (strictly bound by RLS)
      RUNTIME_URL: postgres://app_runtime:runtime_password@localhost:5432/tenant_saas_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked
      # Bootstrap roles with non-superuser privileges
      - name: Create database roles
        run: psql "$BOOTSTRAP_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/00_roles.sql
      - name: Run migrations
        run: sqlx migrate run --source apps/tenant-saas/migrations
        env:
          DATABASE_URL: ${{ env.MIGRATION_URL }}
      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            --network host \
            -e "MINIO_ROOT_USER=minioadmin" \
            -e "MINIO_ROOT_PASSWORD=minioadmin" \
            pgsty/silo:RELEASE.2026-11-09T00-00-00Z \
            server /data --console-address ":9001"
          timeout 30s bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
      - name: Initialize MinIO bucket
        run: |
          docker run --rm --network host pgsty/silo:RELEASE.2026-11-09T00-00-00Z \
            /bin/sh -c "
              mcli alias set local http://localhost:9000 minioadmin minioadmin &&
              mcli mb --ignore-existing local/tenant-documents &&
              mcli anonymous set none local/tenant-documents
            "
      - name: Verify MinIO bucket is private
        run: |
          # Upload a probe object then confirm anonymous GET is 403
          docker run --rm --network host pgsty/silo:RELEASE.2026-11-09T00-00-00Z \
            /bin/sh -c "
              mcli alias set local http://localhost:9000 minioadmin minioadmin &&
              echo probe | mcli pipe local/tenant-documents/ci-private-probe
            "
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:9000/tenant-documents/ci-private-probe")
          [ "$code" = "403" ] || { echo "bucket is not private: got HTTP $code"; exit 1; }
          echo "MinIO private bucket assertion: PASS"
      - name: RLS sanity
        run: |
          psql "$MIGRATION_URL" -c "
            SELECT relname, relrowsecurity, relforcerowsecurity
            FROM pg_class
            WHERE relname IN ('tenants', 'memberships', 'users', 'documents', 'ingestion_jobs', 'document_chunks');
          "
          # Verify app_runtime cannot select password_hash directly
          output=$(psql "$RUNTIME_URL" -c "SELECT password_hash FROM users;" 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "permission denied"
          echo "app_runtime password_hash denial: PASS"
          # Verify app_runtime cannot DELETE documents
          output=$(psql "$RUNTIME_URL" -c "DELETE FROM documents;" 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "permission denied"
          echo "app_runtime DELETE documents denial: PASS"
          # Verify app_runtime cannot DELETE ingestion_jobs
          output=$(psql "$RUNTIME_URL" -c "DELETE FROM ingestion_jobs;" 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "permission denied"
          echo "app_runtime DELETE ingestion_jobs denial: PASS"
          # Chunks are immutable: replace is DELETE + INSERT, never UPDATE
          output=$(psql "$RUNTIME_URL" -c "UPDATE document_chunks SET content = content;" 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "permission denied"
          echo "app_runtime UPDATE document_chunks denial: PASS"
      - name: Verify search indexes exist (Phase 5 T1)
        run: |
          count=$(psql "$MIGRATION_URL" -Atc "SELECT count(*) FROM pg_indexes WHERE tablename = 'document_chunks' AND indexname IN ('document_chunks_tsv_idx', 'document_chunks_embedding_hnsw_idx');")
          test "$count" = "2"
          echo "search indexes: PASS"
      - name: Verify ingestion tables keep RLS without FORCE (plan D2)
        run: |
          # The sweeper is a SECURITY DEFINER function owned by db_owner. It only
          # sees every tenant's rows while the owner is exempt, i.e. RLS is
          # ENABLEd but not FORCEd. A later "tidy-up" adding FORCE would silently
          # stop crash recovery, so fail loudly here.
          bad=$(psql "$MIGRATION_URL" -tAc "
            SELECT string_agg(relname, ',')
            FROM pg_class
            WHERE relname IN ('ingestion_jobs', 'document_chunks')
              AND (NOT relrowsecurity OR relforcerowsecurity);
          ")
          if [ -n "$bad" ]; then
            echo "RLS must be ENABLE without FORCE on: $bad"
            exit 1
          fi
          echo "ingestion RLS ENABLE/no-FORCE: PASS"
      - name: Verify sweep_ingestion_jobs is a locked-down definer function
        run: |
          result=$(psql "$MIGRATION_URL" -tAc "
            SELECT p.prosecdef,
                   coalesce(array_to_string(p.proconfig, ','), '') LIKE '%search_path=%',
                   p.proacl IS NOT NULL
                     AND NOT EXISTS (SELECT 1 FROM aclexplode(p.proacl) a
                                      WHERE a.grantee = 0 AND a.privilege_type = 'EXECUTE'),
                   has_function_privilege('app_runtime', p.oid, 'EXECUTE')
            FROM pg_proc p
            WHERE p.proname = 'sweep_ingestion_jobs';
          ")
          echo "prosecdef|fixed_search_path|no_public_execute|app_runtime_execute = $result"
          [ "$result" = "t|t|t|t" ] || { echo "sweep_ingestion_jobs is not locked down"; exit 1; }
          echo "sweep_ingestion_jobs definer checks: PASS"
      - name: Verify pgvector 0.8.0 or newer is installed
        run: |
          ok=$(psql "$MIGRATION_URL" -tAc "
            SELECT string_to_array(extversion, '.')::int[] >= ARRAY[0, 8, 0]
            FROM pg_extension WHERE extname = 'vector';
          ")
          [ "$ok" = "t" ] || { echo "pgvector >= 0.8.0 is required, got: '$ok'"; exit 1; }
          echo "pgvector version: PASS"
      - name: Verify db_owner and app_runtime are NOT superusers
        run: |
          psql "$BOOTSTRAP_URL" -c "
            DO \$\$
            DECLARE
              rec RECORD;
            BEGIN
              FOR rec IN SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('db_owner', 'app_runtime') LOOP
                IF rec.rolsuper THEN
                  RAISE EXCEPTION 'Role % is a SUPERUSER! This will bypass RLS.', rec.rolname;
                END IF;
                IF rec.rolbypassrls THEN
                  RAISE EXCEPTION 'Role % has BYPASSRLS! This will bypass RLS.', rec.rolname;
                END IF;
              END LOOP;
            END \$\$;
          "
      - name: Verify app_runtime cannot perform DDL
        run: |
          output=$(psql "$RUNTIME_URL" -c "CREATE TABLE forbidden_test ();" 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "permission denied"
          echo "Runtime role DDL restriction: PASS"
      - name: Run tests
        run: cargo test --workspace
        env:
          DATABASE_URL: ${{ env.RUNTIME_URL }}
          # db_owner pool, used by integration tests for fixture seeding only
          DATABASE_MIGRATION_URL: ${{ env.MIGRATION_URL }}
          REDIS_URL: redis://localhost:6379
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: tenant-documents
          OBJECT_STORAGE_ACCESS_KEY: minioadmin
          OBJECT_STORAGE_SECRET_KEY: minioadmin
          OBJECT_STORAGE_BACKEND: s3
          OBJECT_STORAGE_REGION: us-east-1

  build:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      # Both binaries: tenant-saas-api and tenant-saas-worker
      - run: cargo build --release --bins
