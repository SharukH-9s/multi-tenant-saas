[workspace]
resolver = "2"  # Ensures Cargo resolves dependencies using modern Rust 2021 edition rules
members = [
  "apps/tenant-saas",
  "crates/common-auth",
  "crates/common-config",
  "crates/common-database",
  "crates/common-errors",
  "crates/common-messaging",
  "crates/common-storage",
  "crates/common-telemetry",
  "tests",
]

[workspace.dependencies]
# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Web framework ---
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "request-id", "timeout", "trace"] }

# --- Database ---
sqlx = { version = "0.9", features = ["chrono", "postgres", "runtime-tokio", "tls-native-tls", "uuid"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
# --- Common types ---
uuid = { version = "1", features = ["serde", "v4"] }

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

anyhow = "1"
# --- Error handling ---
thiserror = "2"

# --- Auth & crypto (Phase 2) ---
argon2 = "0.6"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"

# --- Cache / rate limiting (Phase 2, Task 9) ---
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }

# --- Test helpers ---
http-body-util = "0.1"

# --- Configuration ---
config = "0.15"
dotenvy = "0.15"

[profile.dev.package.argon2]
opt-level = 3

[profile.test.package.argon2]
opt-level = 3

