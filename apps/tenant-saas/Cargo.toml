[package]
name = "tenant-saas"
version = "0.1.0"
edition = "2021"

[lib]
name = "tenant_saas"
path = "src/lib.rs"

[[bin]]
name = "tenant-saas-api"
path = "src/main.rs"

[dependencies]
common-auth = { path = "../../crates/common-auth" }
common-config = { path = "../../crates/common-config" }
common-database = { path = "../../crates/common-database" }
common-errors = { path = "../../crates/common-errors" }
common-messaging = { path = "../../crates/common-messaging" }
common-storage = { path = "../../crates/common-storage" }
common-telemetry = { path = "../../crates/common-telemetry" }

anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
